<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Carousel Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Image Carousel</h1>

        <div class="carousel" id="carousel">
            <div class="slides">
                <div class="slide">
                    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80" alt="Beautiful landscape">
                    <div class="caption">Beautiful Nature</div>
                </div>

                <div class="slide">
                    <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1200&q=80" alt="Mountain lake">
                    <div class="caption">Mountain Views</div>
                </div>

                <div class="slide">
                    <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1200&q=80" alt="Green forest">
                    <div class="caption">Green Forest</div>
                </div>

                <div class="slide">
                    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80" alt="Sunny beach">
                    <div class="caption">Sunny Beach</div>
                </div>

                <div class="slide">
                    <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1200&q=80" alt="Sunrise landscape">
                    <div class="caption">Peaceful Sunrise</div>
                </div>
            </div>

            <button class="nav prev" id="prev" aria-label="Previous slide">
                &#10094;
            </button>

            <button class="nav next" id="next" aria-label="Next slide">
                &#10095;
            </button>

            <div class="indicators" id="indicators"></div>
        </div>

        <p class="description">
            Explore beautiful places around the world.
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
